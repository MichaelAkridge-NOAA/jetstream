<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobs Dashboard - NOAA JetStream</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <img src="/static/jetstream_logo.png" alt="JetStream Logo" class="header-logo">
            <div class="header-content">
                <h1>NOAA JetStream</h1>
                <p>Cloud Data Management System</p>
            </div>
        </div>
    </div>
    
    <div class="nav-tabs">
        <button class="nav-tab" onclick="window.location.href='/'">🏠 Home</button>
        <button class="nav-tab" onclick="window.location.href='/static/uploads.html'">📤 Uploads</button>
        <button class="nav-tab" onclick="window.location.href='/static/cloud.html'">☁️ Cloud Transfer</button>
        <button class="nav-tab active" onclick="window.location.href='/static/jobs.html'">📋 Jobs</button>
        <button class="nav-tab" onclick="window.location.href='/static/analytics.html'">📊 Analytics</button>
        <button class="nav-tab" onclick="window.location.href='/static/settings.html'">⚙️ Settings</button>
    </div>
    
    <div class="container jobs-page">
        <div class="stats-grid" style="margin-top: 20px;">
            <div class="stat-card">
                <h3>Total Jobs</h3>
                <div class="value" id="all-total-jobs">0</div>
                <div class="label">All time</div>
            </div>
            <div class="stat-card">
                <h3>Completed</h3>
                <div class="value" id="completed-jobs">0</div>
                <div class="label">Successful</div>
            </div>
            <div class="stat-card">
                <h3>Failed</h3>
                <div class="value" id="failed-jobs">0</div>
                <div class="label">Need attention</div>
            </div>
            <div class="stat-card">
                <h3>Running</h3>
                <div class="value" id="running-jobs">0</div>
                <div class="label">Active now</div>
            </div>
        </div>
        
        <div class="jobs-filters">
            <div class="filter-group">
                <label>Status</label>
                <select id="filter-status" onchange="filterJobs()">
                    <option value="">All Statuses</option>
                    <option value="pending">Pending</option>
                    <option value="queued">Queued</option>
                    <option value="running">Running</option>
                    <option value="completed">Completed</option>
                    <option value="failed">Failed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Search</label>
                <input type="text" id="filter-search" placeholder="Job ID, path, bucket..." onkeyup="filterJobs()">
            </div>
            <div class="filter-group">
                <label>Dry Run</label>
                <select id="filter-dry-run" onchange="filterJobs()">
                    <option value="">All</option>
                    <option value="true">Dry Run Only</option>
                    <option value="false">Actual Only</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Split</label>
                <select id="filter-split" onchange="filterJobs()">
                    <option value="">All</option>
                    <option value="true">Split Jobs</option>
                    <option value="false">Non-Split</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Limit</label>
                <select id="filter-limit" onchange="loadAllJobs()">
                    <option value="20">20 jobs</option>
                    <option value="50">50 jobs</option>
                    <option value="100" selected>100 jobs</option>
                    <option value="500">500 jobs</option>
                    <option value="10000">All jobs</option>
                </select>
            </div>
            <button class="btn btn-secondary" onclick="clearFilters()">✖️ Clear Filters</button>
        </div>
        
        <div class="main-content">
            <div class="panel" style="width: 100%;">
                <h2>All Jobs <span id="jobs-last-updated" class="last-updated"></span></h2>
                <div class="jobs-list" id="all-jobs-list" style="max-height: 800px; overflow-y: auto;">
                    <p style="text-align: center; color: #999; padding: 50px 0;">Loading jobs...</p>
                </div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/shared.js"></script>
    <script src="/static/js/jobs.js"></script>
</body>
</html>
