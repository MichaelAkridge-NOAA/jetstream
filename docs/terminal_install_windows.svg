<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Anaconda Prompt installation example</title>
  <desc id="desc">An Anaconda Prompt window showing where to paste the JetStream installation command.</desc>
  <rect width="900" height="430" fill="#f4f6f8"/>
  <text x="38" y="42" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#17212b">1. Paste the install command in Anaconda Prompt</text>
  <rect x="38" y="68" width="824" height="300" rx="6" fill="#0d1117"/>
  <rect x="38" y="68" width="824" height="34" rx="6" fill="#2d333b"/>
  <circle cx="58" cy="85" r="6" fill="#ff5f57"/><circle cx="78" cy="85" r="6" fill="#febc2e"/><circle cx="98" cy="85" r="6" fill="#28c840"/>
  <text x="130" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="#d0d7de">Anaconda Prompt</text>
  <text x="64" y="165" font-family="Consolas,monospace" font-size="21" fill="#79c0ff">(base) C:\Users\Alex&gt;</text>
  <text x="380" y="165" font-family="Consolas,monospace" font-size="21" fill="#f0f6fc">pip install noaa-jetstream</text>
  <text x="64" y="270" font-family="Consolas,monospace" font-size="21" fill="#8b949e">Successfully installed noaa-jetstream in base</text>
  <rect x="610" y="295" width="220" height="36" rx="5" fill="#dbeafe" stroke="#2f81f7"/>
  <text x="624" y="318" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#174ea6">Paste command, press Enter</text>
</svg>
